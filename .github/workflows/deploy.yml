name: Deploy to Cloudflare Pages

# Push to main -> the site auto-updates on Cloudflare Pages.
# (This is the "git-connected" behaviour, implemented via GitHub Actions so it
#  works with an API token only — no Cloudflare dashboard GitHub-App click.)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The copy gate. There is no build step to fail, so without this a reverted
  # policy sentence reaches lyveira.app with nothing complaining.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Policy + link copy gate
        run: bash tests/policy-copy.sh

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lyveira-web --branch=main --commit-dirty=true
